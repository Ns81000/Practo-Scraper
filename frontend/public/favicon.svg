<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle — Clay brand teal -->
  <rect width="32" height="32" rx="8" fill="#1a3a3a"/>
  <!-- Magnifying glass body — Clay cream/peach -->
  <circle cx="14" cy="13" r="6.5" stroke="#ffb084" stroke-width="2.5" fill="none"/>
  <!-- Handle -->
  <line x1="19" y1="18" x2="25" y2="24" stroke="#ffb084" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Plus/cross inside glass — medical motif -->
  <line x1="14" y1="10" x2="14" y2="16" stroke="#fffaf0" stroke-width="2" stroke-linecap="round"/>
  <line x1="11" y1="13" x2="17" y2="13" stroke="#fffaf0" stroke-width="2" stroke-linecap="round"/>
</svg>